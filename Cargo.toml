[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/Aitemaa/Kalux"

[workspace.dependencies]
kalux-core = { path = "crates/kalux-core" }
kalux-decode = { path = "crates/kalux-decode" }
windows = "0.62"
windows-numerics = "0.3"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
zune-core = "0.5"
kamadak-exif = "0.6"
crossbeam-channel = "0.5"
embed-manifest = "1.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
panic = "abort"
