name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # PRD §5 binary size budget for kalux.exe: target 4 MiB, hard limit 8 MiB.
  SIZE_HARD_CAP: 8388608
  SIZE_WARN: 4194304

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (includes WIC decode tests)
        run: cargo test --workspace

      - name: Pure-Rust dependency check (no cc / cmake / webview)
        shell: bash
        run: |
          tree=$(cargo tree --workspace -e normal,build --prefix none --format '{p}')
          bad=$(echo "$tree" | grep -E '^(cc|cmake|webview2|wry|tauri|winit|wgpu) ' || true)
          if [ -n "$bad" ]; then echo "::error::Forbidden dependencies: $bad"; exit 1; fi
          echo "OK: $(echo "$tree" | sort -u | wc -l) crates, all pure Rust"

      - name: Build release
        run: cargo build --release -p kalux-app

      - name: Binary size gate
        shell: bash
        run: |
          size=$(stat -c %s target/release/kalux.exe)
          echo "kalux.exe: $size bytes ($(awk "BEGIN{printf \"%.2f\", $size/1048576}") MiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$SIZE_HARD_CAP" ]; then echo "::error::kalux.exe exceeds the 8 MiB hard cap"; exit 1; fi
          if [ "$size" -gt "$SIZE_WARN" ]; then echo "::warning::kalux.exe is above the 4 MiB target"; fi

      - name: Startup benchmark (PRD §10)
        shell: pwsh
        run: |
          $exe = "target/release/kalux.exe"
          $v = Start-Process $exe -ArgumentList "--version" -Wait -PassThru
          if ($v.ExitCode -ne 0) { throw "--version exited $($v.ExitCode)" }
          New-Item -ItemType Directory -Force bench-out | Out-Null
          & $exe --gen-test-image bench-out/test-12mp.jpg 4000 3000
          if ($LASTEXITCODE -ne 0) { throw "--gen-test-image failed" }
          for ($i = 0; $i -lt 5; $i++) {
            & $exe --bench-startup bench-out/test-12mp.jpg | Tee-Object -Append bench-out/startup.jsonl
            if ($LASTEXITCODE -ne 0) { throw "--bench-startup failed" }
          }
          "### Startup bench (5 runs)`n``````" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content bench-out/startup.jsonl | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "``````" | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kalux-windows-x64
          path: |
            target/release/kalux.exe
            bench-out/startup.jsonl
          if-no-files-found: ignore

  linux-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test platform-independent crates
        run: cargo test -p kalux-core -p kalux-decode
