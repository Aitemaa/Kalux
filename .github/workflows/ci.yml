name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # PRD §5 binary size budget for kalux.exe: target 4 MiB, hard limit 8 MiB.
  SIZE_HARD_CAP: 8388608
  SIZE_WARN: 4194304

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (includes WIC decode tests)
        run: cargo test --workspace

      - name: Pure-Rust dependency check (no cc / cmake / webview)
        shell: bash
        run: |
          tree=$(cargo tree --workspace -e normal,build --prefix none --format '{p}')
          bad=$(echo "$tree" | grep -E '^(cc|cmake|webview2|wry|tauri|winit|wgpu) ' || true)
          if [ -n "$bad" ]; then echo "::error::Forbidden dependencies: $bad"; exit 1; fi
          echo "OK: $(echo "$tree" | sort -u | wc -l) crates, all pure Rust"

      - name: Build release
        run: cargo build --release -p kalux-app

      - name: Binary size gate
        shell: bash
        run: |
          size=$(stat -c %s target/release/kalux.exe)
          echo "kalux.exe: $size bytes ($(awk "BEGIN{printf \"%.2f\", $size/1048576}") MiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$SIZE_HARD_CAP" ]; then echo "::error::kalux.exe exceeds the 8 MiB hard cap"; exit 1; fi
          if [ "$size" -gt "$SIZE_WARN" ]; then echo "::warning::kalux.exe is above the 4 MiB target"; fi

      - name: Startup benchmark (PRD §10)
        shell: pwsh
        run: |
          $exe = "target/release/kalux.exe"
          $v = Start-Process $exe -ArgumentList "--version" -Wait -PassThru
          if ($v.ExitCode -ne 0) { throw "--version exited $($v.ExitCode)" }
          New-Item -ItemType Directory -Force bench-out | Out-Null
          $g = Start-Process $exe -ArgumentList "--gen-test-image", "bench-out/test-12mp.jpg", "4000", "3000" -Wait -PassThru -NoNewWindow
          if ($g.ExitCode -ne 0) { throw "--gen-test-image exited $($g.ExitCode)" }
          for ($i = 0; $i -lt 5; $i++) {
            & $exe --bench-startup bench-out/test-12mp.jpg | Tee-Object -Append bench-out/startup.jsonl
            if ($LASTEXITCODE -ne 0) { throw "--bench-startup failed ($LASTEXITCODE)" }
          }
          "### Startup bench (5 runs)`n``````" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content bench-out/startup.jsonl | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "``````" | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Render screenshots (Direct2D + DirectWrite)
        shell: bash
        run: |
          mkdir -p screenshots-out
          ./target/release/kalux.exe --screenshot assets/demo-photo.jpg screenshots-out/viewer-dark.png \
            --title "dolomites.jpg — 1 / 12 — 1376×768 — Kalux" \
            --toast "100% · Fit"
          ./target/release/kalux.exe --screenshot assets/demo-photo.jpg screenshots-out/shortcuts-light.png \
            --light --help \
            --title "dolomites.jpg — 1 / 12 — 1376×768 — Kalux"
          ls -lh screenshots-out/

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $release = (Resolve-Path target/release).Path
          & $iscc /Q "/DAppVersion=$ver" "/DSourceDir=$release" "/DOutputDir=$release" packaging/windows/kalux.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item target/release/kalux-*-windows-x64-setup.exe | ForEach-Object {
            "installer: $($_.Name) ($($_.Length) bytes)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kalux-windows-x64
          path: |
            target/release/kalux-*-windows-x64-setup.exe
            target/release/kalux.exe
            bench-out/startup.jsonl
            screenshots-out/*.png
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Pure-Rust dependency check (no cc / cmake / pkg-config / wayland-sys)
        run: |
          tree=$(cargo tree --workspace -e normal,build --prefix none --format '{p}')
          bad=$(echo "$tree" | grep -E '^(cc|cmake|pkg-config|wayland-sys|webview2|wry|tauri|winit|wgpu) ' || true)
          if [ -n "$bad" ]; then echo "::error::Forbidden dependencies: $bad"; exit 1; fi
          echo "OK: $(echo "$tree" | sort -u | wc -l) crates, all pure Rust"

      - name: Build release
        run: cargo build --release -p kalux-app

      - name: Binary size & dynamic library gate
        run: |
          size=$(stat -c %s target/release/kalux)
          echo "kalux (linux): $size bytes ($(awk "BEGIN{printf \"%.2f\", $size/1048576}") MiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$SIZE_HARD_CAP" ]; then echo "::error::kalux exceeds the 8 MiB hard cap"; exit 1; fi
          if [ "$size" -gt "$SIZE_WARN" ]; then echo "::warning::kalux is above the 4 MiB target"; fi
          libs=$(ldd target/release/kalux)
          echo "$libs"
          if echo "$libs" | grep -Ei 'libwayland|libX11|libgtk|libQt|libfontconfig'; then
            echo "::error::Unexpected GUI shared library dependency"; exit 1
          fi

      - name: CLI & offscreen screenshot smoke test
        run: |
          mkdir -p bench-out screenshots-out
          ./target/release/kalux --version
          ./target/release/kalux --gen-test-image bench-out/test-12mp.jpg 4000 3000
          ./target/release/kalux --screenshot assets/demo-photo.jpg screenshots-out/linux-dark.png \
            --title "dolomites.jpg — 1 / 12 — 1376×768 — Kalux" \
            --toast "100% · Fit"
          ./target/release/kalux --screenshot assets/demo-photo.jpg screenshots-out/linux-light.png \
            --light --help \
            --title "dolomites.jpg — 1 / 12 — 1376×768 — Kalux"
          ls -lh bench-out/ screenshots-out/

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kalux-linux-x64
          path: |
            target/release/kalux
            packaging/linux/kalux.desktop
            packaging/linux/install.sh
            screenshots-out/*.png
          if-no-files-found: ignore
