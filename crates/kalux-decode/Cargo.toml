[package]
name = "kalux-decode"
description = "Image decoding for Kalux: WIC backend, zune-jpeg fast path, EXIF orientation, background worker pool and preloading store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kalux-core.workspace = true
crossbeam-channel.workspace = true
zune-jpeg.workspace = true
zune-core.workspace = true
kamadak-exif.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }
