[package]
name = "kalux-app"
description = "Kalux: the Win32 + Direct2D image viewer executable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kalux"
path = "src/main.rs"

[dependencies]
kalux-core.workspace = true
kalux-decode.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-numerics.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ab_glyph.workspace = true
jpeg-encoder.workspace = true
png.workspace = true
rustix.workspace = true
wayrs-client.workspace = true
wayrs-protocols.workspace = true

[build-dependencies]
embed-manifest.workspace = true
